<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batch Management</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Playfair+Display:wght@600&display=swap");

      :root {
        --ink: #141418;
        --muted: #6b6f76;
        --paper: #f7f2ea;
        --accent: #ff6b35;
        --accent-2: #00a6a6;
        --line: #e5dcd1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink);
        background: radial-gradient(
            1200px 800px at 10% -10%,
            #ffe6d6,
            transparent 60%
          ),
          radial-gradient(1000px 600px at 90% 10%, #d7f7f2, transparent 55%),
          var(--paper);
        min-height: 100vh;
      }

      header {
        padding: 32px 24px 16px;
      }

      h1 {
        margin: 0 0 6px;
        font-family: "Playfair Display", serif;
        font-size: 36px;
        letter-spacing: 0.5px;
      }

      .subtitle {
        color: var(--muted);
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px 48px;
        animation: fade-in 360ms ease-out;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel {
        background: #fffdf9;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(20, 20, 24, 0.08);
      }

      .panel + .panel {
        margin-top: 20px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button,
      .pill {
        border: none;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      button.secondary {
        background: var(--accent-2);
      }

      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      button:active {
        transform: scale(0.98);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        font-weight: 600;
      }

      .tag {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        background: #1c1f24;
        color: #fff;
        font-size: 12px;
      }

      .tag.off {
        background: #9aa0a6;
      }

      .mono {
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
      }

      .list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }

      .item {
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }

      .item strong {
        display: block;
        margin-bottom: 8px;
      }

      .fields {
        display: grid;
        gap: 8px;
        margin-bottom: 10px;
      }

      .field {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      .input {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 12px;
        font-family: "IBM Plex Sans", sans-serif;
      }

      .inline {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }

      .paging {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 16px;
        color: var(--muted);
      }

      .paging a {
        text-decoration: none;
        color: var(--ink);
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .notice {
        color: var(--muted);
        font-size: 13px;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(20, 20, 24, 0.4);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal.active {
        display: flex;
      }

      .modal-card {
        background: #fffdf9;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        width: min(520px, 100%);
        box-shadow: 0 10px 30px rgba(20, 20, 24, 0.12);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }

      .modal-title {
        margin: 0 0 12px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Batch Management</h1>
      <div class="subtitle">배치 등록과 실행, 상태를 한 화면에서 확인합니다.</div>
    </header>
    <main>
      <section class="panel">
        <div class="panel-header">
          <h2>등록된 배치</h2>
          <div class="actions">
            <a class="pill" href="/batch/history">History</a>
          </div>
        </div>
        <div class="notice">
          총 <span id="total-count" th:text="${batches.totalElements}">0</span>건,
          페이지 <span id="page-number" th:text="${batches.number + 1}">1</span> /
          <span id="page-total" th:text="${batches.totalPages}">1</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>이름</th>
              <th>설명</th>
              <th>스케줄</th>
              <th>스케쥴 On</th>
              <th>재시도</th>
              <th>마지막 실행</th>
              <th>상태</th>
              <th>실행</th>
            </tr>
          </thead>
          <tbody>
            <tr
              th:each="batch : ${batches}"
              th:attr="data-id=${batch.id},
                data-name=${batch.batchName},
                data-desc=${batch.batchDescription},
                data-cron=${batch.schedule != null ? batch.schedule.cronExpression : ''},
                data-timezone=${batch.schedule != null ? batch.schedule.timezone : ''},
                data-schedule-enabled=${batch.schedule != null ? batch.schedule.enabled : false},
                data-retry-count=${batch.retryCount},
                data-retry-interval=${batch.retryInterval},
                data-use-yn=${batch.useYn}"
            >
              <td class="mono" th:text="${batch.batchId}">batch.id</td>
              <td th:text="${batch.batchName}">Batch Name</td>
              <td th:text="${batch.batchDescription}">Description</td>
              <td
                class="mono"
                th:text="${batch.schedule != null && batch.schedule.cronExpression != null ? batch.schedule.cronExpression : '-'}"
              >
                0 * * * * *
              </td>
              <td th:text="${batch.schedule != null && batch.schedule.enabled != null && batch.schedule.enabled ? 'ON' : 'OFF'}">
                OFF
              </td>
              <td th:text="${batch.retryCount} + ' / ' + ${batch.retryInterval} + 'm'">
                3 / 5m
              </td>
              <td
                th:text="${batch.lastExecutionTime != null ? #temporals.format(batch.lastExecutionTime, 'yyyy-MM-dd HH:mm:ss') : '-'}"
              >
                -
              </td>
              <td>
                <span
                  class="tag"
                  th:classappend="${batch.useYn} ? '' : ' off'"
                  th:text="${batch.useYn} ? 'ON' : 'OFF'"
                  >ON</span
                >
              </td>
              <td>
                <button
                  class="ghost"
                  th:attr="data-batch-id=${batch.batchId}"
                  onclick="executeBatch(this)"
                >
                  실행
                </button>
              </td>
            </tr>
            <tr th:if="${batches.totalElements == 0}" data-empty="true">
              <td colspan="9" class="notice">등록된 배치가 없습니다.</td>
            </tr>
          </tbody>
        </table>
        <div class="paging" th:if="${batches.totalPages > 1}">
          <a th:if="${batches.hasPrevious()}" th:href="@{/batch/management(page=${batches.number - 1})}"
            >Prev</a
          >
          <a th:if="${batches.hasNext()}" th:href="@{/batch/management(page=${batches.number + 1})}"
            >Next</a
          >
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>미등록 배치</h2>
          <div class="actions">
            <button class="secondary" id="scan-btn">Scan JARs</button>
            <button class="ghost" id="clear-unregistered">Clear</button>
          </div>
        </div>
        <div id="unregistered" class="list">
          <div class="notice">Scan JARs를 눌러 미등록 배치를 확인하세요.</div>
        </div>
      </section>
    </main>

    <div class="modal" id="edit-modal" aria-hidden="true">
      <div class="modal-card">
        <h3 class="modal-title">배치 설정 수정</h3>
        <div class="fields">
          <label class="field">
            <span>배치명</span>
            <input class="input" id="edit-name" type="text" />
          </label>
          <label class="field">
            <span>설명</span>
            <input class="input" id="edit-desc" type="text" />
          </label>
          <label class="field">
            <span>Cron</span>
            <input class="input" id="edit-cron" type="text" placeholder="0 * * * * *" />
          </label>
          <label class="field">
            <span>Timezone</span>
            <select class="input" id="edit-timezone">
              <option value="">System Default</option>
            </select>
          </label>
          <label class="field">
            <span>Retry Count</span>
            <input class="input" id="edit-retry-count" type="number" min="0" />
          </label>
          <label class="field">
            <span>Retry Interval (min)</span>
            <input class="input" id="edit-retry-interval" type="number" min="0" />
          </label>
          <div class="inline">
            <label>
              <input id="edit-schedule-enabled" type="checkbox" />
              Schedule On
            </label>
            <label>
              <input id="edit-use-yn" type="checkbox" />
              Use
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button class="ghost" id="edit-cancel">Cancel</button>
          <button class="secondary" id="edit-save">Save</button>
        </div>
      </div>
    </div>

    <script>
      const unregistered = document.getElementById("unregistered");
      const scanBtn = document.getElementById("scan-btn");
      const clearBtn = document.getElementById("clear-unregistered");
      const registeredBody = document.querySelector("table tbody");
      const totalCount = document.getElementById("total-count");
      const editModal = document.getElementById("edit-modal");
      const editName = document.getElementById("edit-name");
      const editDesc = document.getElementById("edit-desc");
      const editCron = document.getElementById("edit-cron");
      const editTimezone = document.getElementById("edit-timezone");
      const editRetryCount = document.getElementById("edit-retry-count");
      const editRetryInterval = document.getElementById("edit-retry-interval");
      const editScheduleEnabled = document.getElementById("edit-schedule-enabled");
      const editUseYn = document.getElementById("edit-use-yn");
      const editCancel = document.getElementById("edit-cancel");
      const editSave = document.getElementById("edit-save");
      let editingRow = null;

      let timezoneOptions = null;

      async function loadTimezones() {
        if (timezoneOptions) return timezoneOptions;
        const res = await fetch("/batch/timezones");
        if (!res.ok) throw new Error("timezones failed");
        timezoneOptions = await res.json();
        return timezoneOptions;
      }

      async function applyTimezones(container) {
        const selects = container.querySelectorAll("select[data-field='timezone']");
        if (!selects.length) return;
        try {
          const zones = await loadTimezones();
          selects.forEach((select) => {
            zones.forEach((zone) => {
              const option = document.createElement("option");
              option.value = zone;
              option.textContent = zone;
              select.appendChild(option);
            });
          });
        } catch (e) {
          // Keep system default option if timezones fail.
        }
      }

      async function applyTimezonesToSelect(select) {
        if (!select) return;
        if (select.dataset.loaded === "true") return;
        try {
          const zones = await loadTimezones();
          zones.forEach((zone) => {
            const option = document.createElement("option");
            option.value = zone;
            option.textContent = zone;
            select.appendChild(option);
          });
          select.dataset.loaded = "true";
        } catch (e) {
          // Keep system default option if timezones fail.
        }
      }

      function appendRegisteredBatch(batch) {
        if (!registeredBody) return;
        const emptyRow = registeredBody.querySelector("tr[data-empty='true']");
        if (emptyRow) {
          emptyRow.remove();
        }

        const row = document.createElement("tr");
        const cronValue =
          batch.schedule && batch.schedule.cronExpression
            ? batch.schedule.cronExpression
            : "";
        const timezoneValue =
          batch.schedule && batch.schedule.timezone
            ? batch.schedule.timezone
            : "";
        const scheduleEnabledValue =
          batch.schedule && typeof batch.schedule.enabled === "boolean"
            ? batch.schedule.enabled
            : false;

        row.dataset.id = batch.id || "";
        row.dataset.name = batch.batchName || "";
        row.dataset.desc = batch.batchDescription || "";
        row.dataset.cron = cronValue;
        row.dataset.timezone = timezoneValue;
        row.dataset.scheduleEnabled = scheduleEnabledValue;
        row.dataset.retryCount = batch.retryCount ?? 0;
        row.dataset.retryInterval = batch.retryInterval ?? 0;
        row.dataset.useYn = batch.useYn ? "true" : "false";

        const createCell = (text, className) => {
          const cell = document.createElement("td");
          if (className) cell.className = className;
          cell.textContent = text;
          return cell;
        };

        row.appendChild(createCell(batch.batchId || "-", "mono"));
        row.appendChild(createCell(batch.batchName || "-"));
        row.appendChild(createCell(batch.batchDescription || "-"));

        row.appendChild(
          createCell(cronValue ? cronValue : "-", "mono")
        );
        row.appendChild(createCell(scheduleEnabledValue ? "ON" : "OFF"));

        const retryText = `${batch.retryCount ?? 0} / ${
          batch.retryInterval ?? 0
        }m`;
        row.appendChild(createCell(retryText));

        row.appendChild(createCell(batch.lastExecutionTime || "-"));

        const statusCell = document.createElement("td");
        const statusTag = document.createElement("span");
        statusTag.className = `tag${batch.useYn ? "" : " off"}`;
        statusTag.textContent = batch.useYn ? "ON" : "OFF";
        statusCell.appendChild(statusTag);
        row.appendChild(statusCell);

        const actionCell = document.createElement("td");
        const actionButton = document.createElement("button");
        actionButton.className = "ghost";
        actionButton.textContent = "실행";
        actionButton.setAttribute("data-batch-id", batch.batchId || "");
        actionButton.addEventListener("click", (event) => {
          event.stopPropagation();
          executeBatch(actionButton);
        });
        actionCell.appendChild(actionButton);
        row.appendChild(actionCell);

        registeredBody.appendChild(row);

        if (totalCount) {
          const current = Number(totalCount.textContent || "0");
          totalCount.textContent = Number.isFinite(current)
            ? String(current + 1)
            : "1";
        }
      }

      async function scanUnregisteredBatches() {
        unregistered.innerHTML = "<div class='notice'>Scanning...</div>";
        try {
          const res = await fetch("/batch/scan");
          if (!res.ok) throw new Error("scan failed");
          const list = await res.json();
          if (!list.length) {
            unregistered.innerHTML =
              "<div class='notice'>미등록 배치가 없습니다.</div>";
            return;
          }
          unregistered.innerHTML = list
            .map(
              (className) => `
              <div class="item" data-class="${className}">
                <strong>${className}</strong>
                <div class="fields">
                  <label class="field">
                    <span>Cron</span>
                    <input
                      class="input"
                      data-field="cron"
                      type="text"
                      placeholder="0 * * * * *"
                      required
                    />
                  </label>
                  <label class="field">
                    <span>Timezone</span>
                    <select class="input" data-field="timezone">
                      <option value="">System Default</option>
                    </select>
                  </label>
                  <label class="field">
                    <span>Retry Count</span>
                    <input
                      class="input"
                      data-field="retryCount"
                      type="number"
                      min="0"
                      value="3"
                      required
                    />
                  </label>
                  <label class="field">
                    <span>Retry Interval (min)</span>
                    <input
                      class="input"
                      data-field="retryInterval"
                      type="number"
                      min="0"
                      value="5"
                      required
                    />
                  </label>
                  <div class="inline">
                    <label>
                      <input data-field="scheduleEnabled" type="checkbox" />
                      Schedule On
                    </label>
                    <label>
                      <input data-field="useYn" type="checkbox" checked />
                      Use
                    </label>
                  </div>
                </div>
                <button class="secondary" onclick="registerBatch(this)">Register</button>
              </div>`
            )
            .join("");
          applyTimezones(unregistered);
        } catch (e) {
          unregistered.innerHTML =
            "<div class='notice'>스캔 중 오류가 발생했습니다.</div>";
        }
      }

      scanBtn.addEventListener("click", scanUnregisteredBatches);

      window.addEventListener("load", scanUnregisteredBatches);

      if (registeredBody) {
        registeredBody.addEventListener("click", (event) => {
          const isActionButton = event.target.closest("button");
          if (isActionButton) return;
          const row = event.target.closest("tr[data-id]");
          if (!row) return;
          openEditModal(row);
        });
      }

      clearBtn.addEventListener("click", () => {
        unregistered.innerHTML =
          "<div class='notice'>Scan JARs를 눌러 미등록 배치를 확인하세요.</div>";
      });

      async function registerBatch(button) {
        const item = button.closest(".item");
        if (!item) return;
        const className = item.getAttribute("data-class");
        if (!className) return;

        const getValue = (name) => {
          const input = item.querySelector(`[data-field='${name}']`);
          return input ? input.value.trim() : "";
        };

        const getNumber = (name) => {
          const value = getValue(name);
          if (!value) return null;
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : null;
        };

        const getChecked = (name) => {
          const input = item.querySelector(`[data-field='${name}']`);
          return input ? input.checked : false;
        };

        const cronValue = getValue("cron") || null;
        const timezoneValue = getValue("timezone") || null;
        const retryCountValue = getNumber("retryCount");
        const retryIntervalValue = getNumber("retryInterval");
        const scheduleEnabledValue = getChecked("scheduleEnabled");
        const useYnValue = getChecked("useYn");

        if (!cronValue) {
          alert("Cron은 필수 입력입니다.");
          return;
        }
        if (retryCountValue === null) {
          alert("Retry Count는 필수 입력입니다.");
          return;
        }
        if (retryIntervalValue === null) {
          alert("Retry Interval은 필수 입력입니다.");
          return;
        }
        try {
          button.disabled = true;
          const res = await fetch("/batch/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              className,
              cronExpression: cronValue,
              timezone: timezoneValue,
              scheduleEnabled: scheduleEnabledValue,
              retryCount: retryCountValue,
              retryInterval: retryIntervalValue,
              useYn: useYnValue,
            }),
          });
          if (!res.ok) throw new Error("register failed");
          const batch = await res.json();
          if (!batch.schedule) {
            batch.schedule = { cronExpression: cronValue, timezone: timezoneValue };
          } else if (!batch.schedule.cronExpression && cronValue) {
            batch.schedule.cronExpression = cronValue;
          }
          setTimeout(() => {
            if (item && item.parentElement) {
              item.remove();
            }
            if (batch) {
              appendRegisteredBatch(batch);
            }
            scanUnregisteredBatches();
          }, 300);
        } catch (e) {
          alert("등록 실패: " + e.message);
        } finally {
          button.disabled = false;
        }
      }

      async function executeBatch(button) {
        const batchId = button.getAttribute("data-batch-id");
        if (!batchId) return;
        button.disabled = true;
        try {
          const res = await fetch(`/batch/${batchId}/execute`, {
            method: "POST",
          });
          if (!res.ok) {
            const message = await res.text();
            throw new Error(message || "execute failed");
          }
          alert("배치 실행이 시작되었습니다.");
        } catch (e) {
          alert("실행 실패: " + e.message);
        } finally {
          button.disabled = false;
        }
      }

      function openEditModal(row) {
        editingRow = row;
        editName.value = row.dataset.name || "";
        editDesc.value = row.dataset.desc || "";
        editCron.value = row.dataset.cron || "";
        editRetryCount.value = row.dataset.retryCount || "0";
        editRetryInterval.value = row.dataset.retryInterval || "0";
        editScheduleEnabled.checked = row.dataset.scheduleEnabled === "true";
        editUseYn.checked = row.dataset.useYn === "true";
        editTimezone.value = row.dataset.timezone || "";
        applyTimezonesToSelect(editTimezone);
        editModal.classList.add("active");
        editModal.setAttribute("aria-hidden", "false");
      }

      function closeEditModal() {
        editModal.classList.remove("active");
        editModal.setAttribute("aria-hidden", "true");
        editingRow = null;
      }

      editCancel.addEventListener("click", closeEditModal);

      editModal.addEventListener("click", (event) => {
        if (event.target === editModal) {
          closeEditModal();
        }
      });

      editSave.addEventListener("click", async () => {
        if (!editingRow) return;
        const id = editingRow.dataset.id;
        if (!id) return;

        const payload = {
          batchName: editName.value.trim(),
          batchDescription: editDesc.value.trim(),
          cronExpression: editCron.value.trim(),
          timezone: editTimezone.value.trim() || null,
          scheduleEnabled: editScheduleEnabled.checked,
          retryCount: Number(editRetryCount.value),
          retryInterval: Number(editRetryInterval.value),
          useYn: editUseYn.checked,
        };

        if (!payload.batchName) {
          alert("배치명은 필수 입력입니다.");
          return;
        }
        if (!payload.cronExpression) {
          alert("Cron은 필수 입력입니다.");
          return;
        }
        if (!Number.isFinite(payload.retryCount)) {
          alert("Retry Count는 필수 입력입니다.");
          return;
        }
        if (!Number.isFinite(payload.retryInterval)) {
          alert("Retry Interval은 필수 입력입니다.");
          return;
        }

        try {
          editSave.disabled = true;
          const res = await fetch(`/batch/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error("update failed");
          const updated = await res.json();

          editingRow.dataset.name = updated.batchName || "";
          editingRow.dataset.desc = updated.batchDescription || "";
          editingRow.dataset.cron =
            updated.schedule && updated.schedule.cronExpression
              ? updated.schedule.cronExpression
              : payload.cronExpression;
          editingRow.dataset.timezone =
            updated.schedule && updated.schedule.timezone
              ? updated.schedule.timezone
              : payload.timezone || "";
          editingRow.dataset.scheduleEnabled =
            updated.schedule && typeof updated.schedule.enabled === "boolean"
              ? String(updated.schedule.enabled)
              : String(payload.scheduleEnabled);
          editingRow.dataset.retryCount = String(updated.retryCount ?? payload.retryCount);
          editingRow.dataset.retryInterval = String(updated.retryInterval ?? payload.retryInterval);
          editingRow.dataset.useYn = String(updated.useYn ?? payload.useYn);

          const cells = editingRow.querySelectorAll("td");
          if (cells.length >= 8) {
            cells[1].textContent = updated.batchName || payload.batchName;
            cells[2].textContent = updated.batchDescription || payload.batchDescription;
            const cronText =
              updated.schedule && updated.schedule.cronExpression
                ? updated.schedule.cronExpression
                : payload.cronExpression;
            cells[3].textContent = cronText || "-";
            const scheduleFlag =
              updated.schedule && typeof updated.schedule.enabled === "boolean"
                ? updated.schedule.enabled
                : payload.scheduleEnabled;
            cells[4].textContent = scheduleFlag ? "ON" : "OFF";
            cells[5].textContent = `${updated.retryCount ?? payload.retryCount} / ${
              updated.retryInterval ?? payload.retryInterval
            }m`;
            const statusTag = cells[7].querySelector(".tag");
            if (statusTag) {
              const enabled = updated.useYn ?? payload.useYn;
              statusTag.textContent = enabled ? "ON" : "OFF";
              statusTag.className = `tag${enabled ? "" : " off"}`;
            }
          }

          closeEditModal();
        } catch (e) {
          alert("수정 실패: " + e.message);
        } finally {
          editSave.disabled = false;
        }
      });
    </script>
  </body>
</html>
