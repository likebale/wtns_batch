<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batch History</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Playfair+Display:wght@600&display=swap");

      :root {
        --ink: #141418;
        --muted: #6b6f76;
        --paper: #f7f2ea;
        --accent: #ff6b35;
        --accent-2: #00a6a6;
        --line: #e5dcd1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink);
        background: radial-gradient(
            1100px 700px at 15% -10%,
            #ffe9d9,
            transparent 60%
          ),
          radial-gradient(900px 600px at 90% 15%, #d8f4ef, transparent 55%),
          var(--paper);
        min-height: 100vh;
      }

      header {
        padding: 32px 24px 16px;
      }

      h1 {
        margin: 0 0 6px;
        font-family: "Playfair Display", serif;
        font-size: 34px;
      }

      .subtitle {
        color: var(--muted);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 48px;
        animation: fade-in 360ms ease-out;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel {
        background: #fffdf9;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(20, 20, 24, 0.08);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pill {
        border: none;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 600;
      }

      .tag {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        background: #1c1f24;
        color: #fff;
        font-size: 12px;
      }

      .tag.failed {
        background: #c0392b;
      }

      .tag.running {
        background: #f39c12;
      }

      .mono {
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
      }

      .paging {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 16px;
        color: var(--muted);
      }

      .paging a {
        text-decoration: none;
        color: var(--ink);
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .notice {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Batch History</h1>
      <div class="subtitle">실행 기록을 시간순으로 확인합니다.</div>
    </header>
    <main>
      <section class="panel">
        <div class="panel-header">
          <h2>최근 실행</h2>
          <div class="actions">
            <a class="pill" href="/batch/management">Management</a>
          </div>
        </div>
        <div class="notice">
          총 <span th:text="${histories.totalElements}">0</span>건,
          페이지 <span th:text="${histories.number + 1}">1</span> /
          <span th:text="${histories.totalPages}">1</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Batch ID</th>
              <th>타입</th>
              <th>상태</th>
              <th>시작</th>
              <th>종료</th>
              <th>Detail</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="history : ${histories}">
              <td class="mono" th:text="${history.id}">1</td>
              <td class="mono" th:text="${history.batchId}">batch</td>
              <td th:text="${history.executionType}">MANUAL</td>
              <td>
                <span
                  class="tag"
                  th:classappend="${history.status.name() == 'FAILED'} ? ' failed' : (${history.status.name() == 'RUNNING'} ? ' running' : '')"
                  th:text="${history.status}"
                  >SUCCESS</span
                >
              </td>
              <td th:text="${history.startTime}">-</td>
              <td th:text="${history.endTime}">-</td>
              <td>
                <a th:href="@{/batch/history/{id}(id=${history.id})}">보기</a>
              </td>
            </tr>
            <tr th:if="${histories.totalElements == 0}">
              <td colspan="7" class="notice">실행 이력이 없습니다.</td>
            </tr>
          </tbody>
        </table>
        <div class="paging" th:if="${histories.totalPages > 1}">
          <a th:if="${histories.hasPrevious()}" th:href="@{/batch/history(page=${histories.number - 1})}"
            >Prev</a
          >
          <a th:if="${histories.hasNext()}" th:href="@{/batch/history(page=${histories.number + 1})}"
            >Next</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
