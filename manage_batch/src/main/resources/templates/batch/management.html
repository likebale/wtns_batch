<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batch Management</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Playfair+Display:wght@600&display=swap");

      :root {
        --ink: #141418;
        --muted: #6b6f76;
        --paper: #f7f2ea;
        --accent: #ff6b35;
        --accent-2: #00a6a6;
        --line: #e5dcd1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink);
        background: radial-gradient(
            1200px 800px at 10% -10%,
            #ffe6d6,
            transparent 60%
          ),
          radial-gradient(1000px 600px at 90% 10%, #d7f7f2, transparent 55%),
          var(--paper);
        min-height: 100vh;
      }

      header {
        padding: 32px 24px 16px;
      }

      h1 {
        margin: 0 0 6px;
        font-family: "Playfair Display", serif;
        font-size: 36px;
        letter-spacing: 0.5px;
      }

      .subtitle {
        color: var(--muted);
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px 48px;
        animation: fade-in 360ms ease-out;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel {
        background: #fffdf9;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(20, 20, 24, 0.08);
      }

      .panel + .panel {
        margin-top: 20px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button,
      .pill {
        border: none;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      button.secondary {
        background: var(--accent-2);
      }

      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      button:active {
        transform: scale(0.98);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 600;
      }

      .tag {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        background: #1c1f24;
        color: #fff;
        font-size: 12px;
      }

      .tag.off {
        background: #9aa0a6;
      }

      .mono {
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
      }

      .list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }

      .item {
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }

      .item strong {
        display: block;
        margin-bottom: 8px;
      }

      .paging {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 16px;
        color: var(--muted);
      }

      .paging a {
        text-decoration: none;
        color: var(--ink);
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .notice {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Batch Management</h1>
      <div class="subtitle">배치 등록과 실행, 상태를 한 화면에서 확인합니다.</div>
    </header>
    <main>
      <section class="panel">
        <div class="panel-header">
          <h2>등록된 배치</h2>
          <div class="actions">
            <button class="secondary" id="scan-btn">Scan JARs</button>
            <a class="pill" href="/batch/history">History</a>
          </div>
        </div>
        <div class="notice">
          총 <span th:text="${batches.totalElements}">0</span>건,
          페이지 <span th:text="${batches.number + 1}">1</span> /
          <span th:text="${batches.totalPages}">1</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>이름</th>
              <th>설명</th>
              <th>스케줄</th>
              <th>재시도</th>
              <th>마지막 실행</th>
              <th>상태</th>
              <th>실행</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="batch : ${batches}">
              <td class="mono" th:text="${batch.batchId}">batch.id</td>
              <td th:text="${batch.batchName}">Batch Name</td>
              <td th:text="${batch.batchDescription}">Description</td>
              <td class="mono" th:text="${batch.cronExpression}">0 * * * * *</td>
              <td th:text="${batch.retryCount} + ' / ' + ${batch.retryInterval} + 'm'">
                3 / 5m
              </td>
              <td th:text="${batch.lastExecutionTime}">-</td>
              <td>
                <span
                  class="tag"
                  th:classappend="${batch.useYn} ? '' : ' off'"
                  th:text="${batch.useYn} ? 'ON' : 'OFF'"
                  >ON</span
                >
              </td>
              <td>
                <button
                  class="ghost"
                  th:attr="data-batch-id=${batch.batchId}"
                  onclick="executeBatch(this)"
                >
                  실행
                </button>
              </td>
            </tr>
            <tr th:if="${batches.totalElements == 0}">
              <td colspan="8" class="notice">등록된 배치가 없습니다.</td>
            </tr>
          </tbody>
        </table>
        <div class="paging" th:if="${batches.totalPages > 1}">
          <a th:if="${batches.hasPrevious()}" th:href="@{/batch/management(page=${batches.number - 1})}"
            >Prev</a
          >
          <a th:if="${batches.hasNext()}" th:href="@{/batch/management(page=${batches.number + 1})}"
            >Next</a
          >
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>미등록 배치</h2>
          <div class="actions">
            <button class="ghost" id="clear-unregistered">Clear</button>
          </div>
        </div>
        <div id="unregistered" class="list">
          <div class="notice">Scan JARs를 눌러 미등록 배치를 확인하세요.</div>
        </div>
      </section>
    </main>

    <script>
      const unregistered = document.getElementById("unregistered");
      const scanBtn = document.getElementById("scan-btn");
      const clearBtn = document.getElementById("clear-unregistered");

      scanBtn.addEventListener("click", async () => {
        unregistered.innerHTML = "<div class='notice'>Scanning...</div>";
        try {
          const res = await fetch("/batch/scan");
          if (!res.ok) throw new Error("scan failed");
          const list = await res.json();
          if (!list.length) {
            unregistered.innerHTML =
              "<div class='notice'>미등록 배치가 없습니다.</div>";
            return;
          }
          unregistered.innerHTML = list
            .map(
              (className) => `
              <div class="item">
                <strong>${className}</strong>
                <button class="secondary" onclick="registerBatch('${className}')">Register</button>
              </div>`
            )
            .join("");
        } catch (e) {
          unregistered.innerHTML =
            "<div class='notice'>스캔 중 오류가 발생했습니다.</div>";
        }
      });

      clearBtn.addEventListener("click", () => {
        unregistered.innerHTML =
          "<div class='notice'>Scan JARs를 눌러 미등록 배치를 확인하세요.</div>";
      });

      async function registerBatch(className) {
        try {
          const res = await fetch("/batch/register", {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: className,
          });
          if (!res.ok) throw new Error("register failed");
          location.reload();
        } catch (e) {
          alert("등록 실패: " + e.message);
        }
      }

      async function executeBatch(button) {
        const batchId = button.getAttribute("data-batch-id");
        if (!batchId) return;
        button.disabled = true;
        try {
          const res = await fetch(`/batch/${batchId}/execute`, {
            method: "POST",
          });
          if (!res.ok) {
            const message = await res.text();
            throw new Error(message || "execute failed");
          }
          alert("배치 실행이 시작되었습니다.");
        } catch (e) {
          alert("실행 실패: " + e.message);
        } finally {
          button.disabled = false;
        }
      }
    </script>
  </body>
</html>
