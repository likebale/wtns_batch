spring:
  application:
    name: batch-management-system

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:batchdb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
    cache-names:
      - batchRetry

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

logging:
  level:
    com.widetns.batch: DEBUG
    org.springframework.web: INFO
  charset:
    console: UTF-8

server:
  port: 8080

batch:
  lib-path: batch-libs
  scan-on-startup: true
